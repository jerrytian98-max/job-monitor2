name: User 1 Job Monitor

on:
  schedule:
    # UTC 13:00，即北京时间每周二和周五 21:00。
    - cron: '0 13 * * 2,5'
  workflow_dispatch:

# This workflow owns only User 1's config, cache and artifact.
concurrency:
  group: job-monitor-user1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scrape-user1-jobs:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Restore User 1 job state
        id: restore-user1-job-state
        uses: actions/cache/restore@v4
        with:
          path: |
            jobs.db
            jobs_cache.json
          key: job-monitor-state-user1-${{ github.run_id }}
          restore-keys: |
            job-monitor-state-user1-

      - name: Restore User 1 private configuration
        env:
          JOB_MONITOR_USER1_CONFIG_B64: ${{ secrets.JOB_MONITOR_USER1_CONFIG_B64 }}
        run: >-
          python github_config.py restore --config config.yaml
          --secret-env JOB_MONITOR_USER1_CONFIG_B64

      - name: Run User 1 check
        env:
          JOB_PROFILE: ""
          # Optional fallbacks when the uploaded config deliberately omits them.
          JOB_EMAIL_AUTH_CODE: ${{ secrets.JOB_MONITOR_USER1_EMAIL_AUTH_CODE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_USER1 }}
        run: python main.py --config config.yaml --once

      - name: Save User 1 job state
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            jobs.db
            jobs_cache.json
          key: job-monitor-state-user1-${{ github.run_id }}

      - name: Publish User 1 downloadable job state
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: job-monitor-state-user1
          path: |
            jobs.db
            jobs_cache.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
