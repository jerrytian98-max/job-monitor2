name: User 1 Job Monitor

on:
  schedule:
    # UTC 13:00，即北京时间每周二和周五 21:00。
    - cron: '0 13 * * 2,5'
  workflow_dispatch:

concurrency:
  group: job-monitor-user1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  monitor:
    permissions:
      contents: read
    uses: ./.github/workflows/monitor_profile.yml
    with:
      profile: ''
    secrets:
      config_b64: ${{ secrets.JOB_MONITOR_USER1_CONFIG_B64 }}
      email_auth_code: ${{ secrets.JOB_MONITOR_USER1_EMAIL_AUTH_CODE }}
      gemini_api_key: ${{ secrets.GEMINI_API_KEY_USER1 }}
      openai_api_key: ${{ secrets.OPENAI_API_KEY_USER1 }}
      deepseek_api_key: ${{ secrets.DEEPSEEK_API_KEY_USER1 }}
