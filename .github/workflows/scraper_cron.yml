name: Daily Job Monitor

on:
  schedule:
    # UTC 00:00，即新加坡/北京时间每天 08:00。
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: daily-job-monitor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scrape-jobs:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Restore private job state
        id: restore-job-state
        uses: actions/cache/restore@v4
        with:
          path: |
            jobs*.db
            jobs_cache*.json
          key: job-monitor-state-${{ github.run_id }}
          restore-keys: |
            job-monitor-state-

      - name: Restore private configuration
        env:
          JOB_MONITOR_CONFIG_B64: ${{ secrets.JOB_MONITOR_CONFIG_B64 }}
        run: python github_config.py restore

      - name: Run one check for every profile
        env:
          JOB_EMAIL_AUTH_CODE: ${{ secrets.JOB_EMAIL_AUTH_CODE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python run_all_profiles.py --once

      - name: Save private job state
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            jobs*.db
            jobs_cache*.json
          key: job-monitor-state-${{ github.run_id }}

      - name: Publish downloadable job state
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: job-monitor-state
          path: |
            jobs*.db
            jobs_cache*.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
